<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <!-- ZefirCraft White Vector Logo & Master Monogram -->
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#ffffff" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g filter="url(#glow)">
    <!-- Outer Shield / Diamond Minecraft Geometry -->
    <path d="M256 32 L464 144 V368 L256 480 L48 368 V144 Z" stroke="#FFFFFF" stroke-width="18" stroke-linejoin="round" fill="none" opacity="0.9"/>
    
    <!-- Isometric Cube Core -->
    <path d="M256 112 L384 184 L256 256 L128 184 Z" fill="#FFFFFF" fill-opacity="0.95"/>
    <path d="M128 198 L246 264 V396 L128 330 Z" fill="#FFFFFF" fill-opacity="0.8"/>
    <path d="M266 264 L384 198 V330 L266 396 Z" fill="#FFFFFF" fill-opacity="0.9"/>

    <!-- Minecraft 'Z' Monogram in negative space / cuts -->
    <path d="M200 190 H312 L240 280 H312 V304 H200 L272 214 H200 Z" fill="#0A152D"/>

    <!-- Dynamic Sword & Wind / Zephyr Blade Wings -->
    <path d="M256 64 L276 120 H236 Z" fill="#FFFFFF"/>
    <circle cx="256" cy="76" r="6" fill="#FFFFFF"/>
  </g>
</svg>
